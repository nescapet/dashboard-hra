<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Odontología 2026 — Hospital Dr. Leonardo Guzmán</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --az1:#0B4F72;--az2:#1A7AAF;--az3:#2196C4;--azc:#E8F4FB;--azm:#B8D9EE;
  --teal:#0F8B8D;--verde:#00C853;--vbg:#E0FFF0;
  --amber:#9A6200;--abg:#FEF3CD;
  --rojo:#E53935;--rbg:#FDECEA;
  --fondo:#F4F7FA;--borde:#DDE8F0;--texto:#0D2E42;--muted:#6B8CA4;--blanco:#fff;
  --r:10px;--r2:14px;
}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--fondo);color:var(--texto);font-size:13px}
/* LOADER */
#loader{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.spin{width:40px;height:40px;border:3px solid var(--azc);border-top-color:var(--az2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* HEADER */
.hdr{background:var(--blanco);border-bottom:1px solid var(--borde);padding:0 24px;display:flex;align-items:center;gap:0;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(11,79,114,.06)}
.hdr-brand{display:flex;align-items:center;gap:12px;padding-right:24px;border-right:1px solid var(--borde)}
.logo{width:36px;height:36px;border-radius:50%;background:var(--az1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;letter-spacing:-.5px;flex-shrink:0}
.brand-txt h1{font-size:13px;font-weight:700;color:var(--az1);line-height:1.2}
.brand-txt p{font-size:10px;color:var(--muted)}
.hdr-nav{display:flex;align-items:center;gap:2px;padding:0 20px;flex:1}
.nb{padding:6px 14px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:7px;transition:all .15s}
.nb:hover{background:var(--azc);color:var(--az1)}
.nb.on{background:var(--az1);color:#fff}
.hdr-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.sel{font-family:inherit;font-size:12px;font-weight:600;color:var(--az1);background:var(--azc);border:1px solid var(--azm);border-radius:7px;padding:6px 12px;cursor:pointer;outline:none}
.live{background:#E6F9F2;color:#0E7A5A;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px}
.upd{font-size:10px;color:var(--muted)}
/* MAIN */
.main{padding:20px 24px 48px;max-width:1200px;margin:0 auto}
/* KPI */
.krow{display:grid;gap:12px;margin-bottom:20px}
.krow5{grid-template-columns:repeat(5,minmax(0,1fr))}
.krow3{grid-template-columns:repeat(3,minmax(0,1fr))}
.krow4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kc{background:var(--blanco);border-radius:var(--r2);border:1px solid var(--borde);padding:16px 16px 13px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.kc:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(11,79,114,.09)}
.kc-bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r2) var(--r2) 0 0}
.klbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.kval{font-size:22px;font-weight:700;line-height:1;margin-bottom:3px}
.ksub{font-size:11px;color:var(--muted)}
.pbar{height:3px;background:var(--borde);border-radius:2px;margin-top:8px;overflow:hidden}
.pbf{height:100%;border-radius:2px;width:0%;transition:width 1.2s cubic-bezier(.4,0,.2,1)}
.ppct{font-size:10px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
.bdg{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px}
.bok{background:#E0FFF0;color:#00A846;font-weight:700}.bwarn{background:var(--abg);color:var(--amber)}.blow{background:var(--rbg);color:var(--rojo)}.binfo{background:var(--azc);color:var(--az1)}
/* CARDS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.g13{display:grid;grid-template-columns:1fr 2fr;gap:16px;margin-bottom:20px}
.card{background:var(--blanco);border-radius:var(--r2);border:1px solid var(--borde);padding:18px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.ct{font-size:13px;font-weight:700;color:var(--texto)}
.cs{font-size:11px;color:var(--muted);margin-top:2px}
/* TABLA */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 10px 10px;text-align:left;border-bottom:1px solid var(--borde);white-space:nowrap}
.tbl th.r{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid #F0F5F9;vertical-align:middle}
.tbl td.r{text-align:right}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#F7FBFE}
.ename{font-weight:600;color:var(--az1)}
.espec{font-size:10px;color:var(--muted);margin-top:1px}
.mbar{height:4px;background:var(--borde);border-radius:2px;overflow:hidden;width:56px;display:inline-block;vertical-align:middle}
.mbarf{height:100%;border-radius:2px}
/* FILTROS */
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 14px;border:1px solid var(--borde);border-radius:20px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;background:var(--blanco);transition:all .15s;font-family:inherit}
.chip:hover{border-color:var(--az2);color:var(--az1)}
.chip.on{background:var(--az1);color:#fff;border-color:var(--az1)}
/* ANIM */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .35s ease both}
.fu:nth-child(1){animation-delay:.04s}.fu:nth-child(2){animation-delay:.08s}
.fu:nth-child(3){animation-delay:.12s}.fu:nth-child(4){animation-delay:.16s}
.fu:nth-child(5){animation-delay:.20s}
/* SECTION LABEL */
.slbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.slbl::after{content:'';flex:1;height:1px;background:var(--borde)}
/* GAUGE */
.gauge-num{font-size:26px;font-weight:700;text-align:center;line-height:1}
.gauge-lbl{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
/* STAT ROW */
.srow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F5F9}
.srow:last-child{border-bottom:none}
.slname{font-size:12px;font-weight:500;color:var(--texto)}
.slval{font-size:12px;font-weight:700}
@media(max-width:900px){.krow5{grid-template-columns:repeat(3,1fr)}.g2,.g3,.g13{grid-template-columns:1fr}}
@media(max-width:600px){.krow5,.krow3,.krow4{grid-template-columns:1fr 1fr}.main{padding:12px 12px 40px}}

/* ── RESPONSIVE MOBILE ── */
@media(max-width:768px){
  /* Header */
  .hdr{height:auto;padding:10px 12px;flex-wrap:wrap;gap:8px}
  .hdr-brand{padding-right:12px;border-right:none;border-bottom:none}
  .hdr-brand img{width:34px;height:34px}
  .brand-txt h1{font-size:12px}
  .brand-txt p{font-size:9px}
  /* Nav */
  .hdr-nav{flex:none;width:100%;justify-content:flex-start;padding:4px 0 0;gap:4px;border-top:1px solid var(--borde)}
  .nb{font-size:11px;padding:5px 10px}
  /* Selector mes */
  .hdr-r{width:100%;justify-content:space-between;border-top:1px solid var(--borde);padding-top:8px}
  /* Main */
  .main{padding:10px 10px 40px}
  /* KPIs: 2 columnas en mobile */
  .g2{grid-template-columns:repeat(2,1fr) !important}
  /* Filtros en cascada: apilados */
  .frow{flex-direction:column;align-items:flex-start;gap:6px}
  .frow .arr{display:none}
  .frow select,.frow .chip{width:100%}
  /* Panel indicadores específicos: apilado vertical */
  .ind-panel{grid-template-columns:1fr !important}
  .ind-left{min-height:auto !important;flex-direction:row !important;flex-wrap:wrap;gap:12px;padding:14px !important}
  .ind-left-info{flex:1}
  .ind-left-profs{margin-top:0 !important}
  /* Cards indicadores: 2 columnas en mobile */
  .ind-cards{grid-template-columns:repeat(2,1fr) !important}
  /* Tablas */
  table{font-size:11px}
  .ename{font-size:11px}
  .espec{font-size:9px}
}
@media(max-width:480px){
  .g2{grid-template-columns:1fr !important}
  .ind-cards{grid-template-columns:1fr !important}
}
</style>
</head>

<script>
const DATA_URL = 'datos.json';
let DB = null, espActiva = 'todas', profActivo = 'todos';
let charts = {};

// ── UTILIDADES ──
const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
const fmt = n => {
  if(!n||n===0) return '$0';
  if(n>=1e6) return '$'+(Math.round(n/1e5)/10).toFixed(1)+'M';
  if(n>=1e3) return '$'+Math.round(n/1e3)+'K';
  return '$'+n.toLocaleString('es-CL');
};
const pcls = p => p>=85?'bok':p>=55?'bwarn':'blow';
const pclr = p => p>=85?'#0E7A5A':p>=55?'#9A6200':'#C0392B';
const destroyCharts = () => {Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});charts={};};

// ── CARGA DE DATOS ──
async function cargarDatos(){
  try{
    const r = await fetch(DATA_URL+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    DB = await r.json();
    document.getElementById('upd-lbl').textContent = 'Actualizado: '+DB.actualizado;
    poblarMeses();
    poblarFiltros();
    render();
    document.getElementById('loader').style.display='none';
    document.getElementById('app').style.display='block';
  } catch(e){
    document.getElementById('loader').innerHTML = '<div style="color:#C0392B;font-size:14px;text-align:center;padding:20px">Error al cargar datos.<br><small>'+e.message+'</small></div>';
  }
}

function poblarMeses(){
  const sel = document.getElementById('sel-mes');
  sel.innerHTML = '<option value="acum">Acumulado '+DB.meses.length+' meses</option>';
  DB.meses.forEach(m=>{
    const label = m.replace('01_','').replace('02_','').replace('03_','').replace('04_','').replace('05_','').replace('06_','').replace('07_','').replace('08_','').replace('09_','').replace(/^\d+_/,'');
    const opt = document.createElement('option');
    opt.value=m; opt.textContent=label+' 2026';
    sel.appendChild(opt);
  });
}

// ── DATOS AGREGADOS ──
function getDatoEsp(nombre, mes){
  const meses = DB.especialistas[nombre]?.meses || {};
  if(mes==='acum'){
    return Object.values(meses).reduce((a,b)=>({
      cne:a.cne+b.cne, control:a.control+b.control, altas:a.altas+b.altas,
      inasist_cne:a.inasist_cne+b.inasist_cne, inasist_ctrl:a.inasist_ctrl+b.inasist_ctrl,
      ppv:a.ppv+b.ppv, ingresos:a.ingresos+b.ingresos,
      meta_altas_mes:a.meta_altas_mes+b.meta_altas_mes,
      meta_cne_mes:a.meta_cne_mes+b.meta_cne_mes,
    }),{cne:0,control:0,altas:0,inasist_cne:0,inasist_ctrl:0,ppv:0,ingresos:0,meta_altas_mes:0,meta_cne_mes:0});
  }
  return meses[mes]||{cne:0,control:0,altas:0,inasist_cne:0,inasist_ctrl:0,ppv:0,ingresos:0,meta_altas_mes:0,meta_cne_mes:0};
}

function getTotales(mes, filtroEsp, filtroPro){
  let cne=0,ctrl=0,altas=0,ic=0,ik=0,ppv=0,mA=0,mC=0;
  Object.keys(DB.especialistas).forEach(n=>{
    const e=DB.especialistas[n];
    if(filtroEsp && filtroEsp!=='todas' && e.especialidad!==filtroEsp) return;
    if(filtroPro && filtroPro!=='todos' && n!==filtroPro) return;
    const d=getDatoEsp(n,mes);
    cne+=d.cne;ctrl+=d.control;altas+=d.altas;
    ic+=d.inasist_cne;ik+=d.inasist_ctrl;ppv+=d.ppv;
    mA+=d.meta_altas_mes; mC+=d.meta_cne_mes;
  });
  return {cne,ctrl,altas,ic,ik,ppv,mA,mC};
}

function getMesPorNum(num){
  return DB.meses.find(m=>m.startsWith(num+'_')||m.startsWith('0'+num+'_'))||null;
}

function poblarFiltros(){
  const esps = [...new Set(Object.values(DB.especialistas).map(e=>e.especialidad))].sort();
  const selEsp = document.getElementById('sel-esp');
  selEsp.innerHTML = '<option value="todas">Todas las especialidades</option>'+
    esps.map(e=>`<option value="${e}">${e}</option>`).join('');
  actualizarProfSelect();
}

function actualizarProfSelect(){
  const profs = Object.keys(DB.especialistas).filter(n=>
    espActiva==='todas' || DB.especialistas[n].especialidad===espActiva
  ).sort();
  const selProf = document.getElementById('sel-prof');
  selProf.innerHTML = '<option value="todos">Todos los profesionales</option>'+
    profs.map(n=>`<option value="${n}">${n}</option>`).join('');
  selProf.value = profActivo;
}

function actualizarBtnTodos(){
  const btn = document.getElementById('btn-todos');
  if(!btn) return;
  const on = espActiva==='todas' && profActivo==='todos';
  btn.style.background = on ? 'var(--az1)' : 'var(--azc)';
  btn.style.color = on ? '#fff' : 'var(--az1)';
  btn.style.borderColor = on ? 'var(--az1)' : 'var(--azm)';
}

// ── RENDER PRINCIPAL ──
function render(){
  destroyCharts();
  const mes = document.getElementById('sel-mes')?.value||'acum';
  const cnt = document.getElementById('cnt');
  if(profActivo!=='todos') cnt.innerHTML = renderGeneral(mes) + renderProfesionalInline(mes);
  else if(espActiva!=='todas') cnt.innerHTML = renderGeneral(mes) + renderEspecialidadInline(mes);
  else cnt.innerHTML = renderGeneral(mes) + renderVistaTodos(mes);
  setTimeout(()=>drawCharts(mes),80);
}

// ── KPI CARD SIMPLE ──
function kpi(color,lbl,val,sub){
  return `<div class="kc fu">
    <div class="kc-bar" style="background:${color}"></div>
    <div class="klbl">${lbl}</div>
    <div class="kval" style="color:${color}">${val}</div>
    <div class="ksub">${sub}</div>
  </div>`;
}

// ── KPI CON SEMÁFORO ──
function kpiSemaforo(lbl, val, sub, pctReal, pctEsperado){
  const ratio = pctEsperado > 0 ? (pctReal / pctEsperado) * 100 : 0;
  let color, icono, bdgCls, estado;
  if(ratio < 85){ color='#E53935'; icono='✗'; bdgCls='blow'; estado='Bajo lo esperado'; }
  else if(ratio > 115){ color='#E53935'; icono='✗'; bdgCls='blow'; estado='Sobre lo esperado'; }
  else { color='#00C853'; icono='✓'; bdgCls='bok'; estado='Dentro del rango'; }
  return `<div class="kc fu">
    <div class="kc-bar" style="background:${color}"></div>
    <div class="klbl">${lbl}</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="kval" style="color:${color}">${val}</div>
      <span style="font-size:22px;font-weight:900;color:${color}">${icono}</span>
    </div>
    <div class="ksub">${sub}</div>
    <div class="pbar"><div class="pbf" style="background:${color}" data-w="${Math.min(pctReal,100)}"></div></div>
    <div class="ppct">${pctReal}% anual <span class="bdg ${bdgCls}">${estado}</span></div>
  </div>`;
}

// ── VISTA GENERAL ──
function renderGeneral(mes){
  const t=getTotales(mes, espActiva, profActivo);
  // When filtering by speciality or professional, use corresponding metas
  let META_ALTAS_ANUAL=4233, META_CNE_ANUAL=6326;
  if(profActivo && profActivo!=='todos'){
    const ep = DB.especialistas[profActivo];
    META_ALTAS_ANUAL = ep ? ep.meta_altas : 0;
    META_CNE_ANUAL   = ep ? ep.meta_cne   : 0;
  } else if(espActiva && espActiva!=='todas'){
    META_ALTAS_ANUAL=0; META_CNE_ANUAL=0;
    Object.entries(DB.especialistas).forEach(([n,e])=>{
      if(e.especialidad===espActiva){ META_ALTAS_ANUAL+=e.meta_altas; META_CNE_ANUAL+=e.meta_cne; }
    });
  }
  const nMeses = mes==='acum' ? DB.meses.length : 1;

  const pA = pct(t.altas, META_ALTAS_ANUAL);
  const pC = pct(t.cne,   META_CNE_ANUAL);
  const pEsperado = Math.round(nMeses / 12 * 100);

  const pCumpl = Math.round((pA + pC) / 2);
  const ratioCumpl = pEsperado > 0 ? (pCumpl / pEsperado) * 100 : 0;
  let colorCumpl, iconoCumpl, bdgCumpl, estadoCumpl;
  if(ratioCumpl < 85){ colorCumpl='#E53935'; iconoCumpl='✗'; bdgCumpl='blow'; estadoCumpl='Bajo lo esperado'; }
  else if(ratioCumpl > 115){ colorCumpl='#E53935'; iconoCumpl='✗'; bdgCumpl='blow'; estadoCumpl='Sobre lo esperado'; }
  else { colorCumpl='#00C853'; iconoCumpl='✓'; bdgCumpl='bok'; estadoCumpl='Dentro del rango'; }

  // Top 5 por altas (filtrado por especialidad si aplica)
  const top5 = Object.entries(DB.especialistas)
    .filter(([n,e])=>!espActiva||espActiva==='todas'||e.especialidad===espActiva)
    .map(([n,e])=>{const d=getDatoEsp(n,mes);return{n,d,e};})
    .sort((a,b)=>b.d.altas-a.d.altas).slice(0,5);

  const top5rows = top5.map(x=>{
    const mA=x.d.meta_altas_mes;
    const p=pct(x.d.altas,mA);
    return `<div class="srow">
      <div><div class="slname">${x.n}</div><div style="font-size:10px;color:var(--muted)">${x.e.especialidad}</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="mbar"><div class="mbarf" style="width:${Math.min(p,100)}%;background:${x.e.color}"></div></div>
        <span style="font-size:12px;font-weight:700;color:${x.e.color}">${x.d.altas}</span>
        <span class="bdg ${pcls(p)}">${p}%</span>
      </div>
    </div>`;

  // ── Cálculo top 2 CNE
  const espInasCNE = Object.entries(DB.especialistas).map(([n,e])=>{
    const d=getDatoEsp(n,mes);
    return {esp:e.especialidad, ic:d.inasist_cne, cne:d.cne};
  }).reduce((acc,x)=>{
    if(!acc[x.esp]) acc[x.esp]={ic:0,cne:0};
    acc[x.esp].ic+=x.ic; acc[x.esp].cne+=x.cne; return acc;

  const sortedCNE=Object.entries(espInasCNE).map(([e,v])=>({e,p:v.cne>0?Math.round(v.ic/v.cne*100):0,ic:v.ic})).filter(x=>x.ic>0).sort((a,b)=>b.p-a.p);
  const top2cne=sortedCNE.slice(0,2);

  // ── Cálculo top 2 Control

    acc[x.esp].ik+=x.ik; acc[x.esp].ctrl+=x.ctrl; return acc;

  const sortedCtrl=Object.entries(espInasCtrl).map(([e,v])=>({e,p:v.ctrl>0?Math.round(v.ik/v.ctrl*100):0,ik:v.ik})).filter(x=>x.ik>0).sort((a,b)=>b.p-a.p);

  const totDiaCNE = Object.values(cntDiaCNE).reduce((s,v)=>s+v,0);
  const totDiaCtrl = Object.values(cntDiaCtrl).reduce((s,v)=>s+v,0);
  const pctDiaCNE = totDiaCNE>0?Math.round(cntDiaCNE[diaMasCNE]/totDiaCNE*100):0;
  const pctDiaCtrl = totDiaCtrl>0?Math.round(cntDiaCtrl[diaMasCtrl]/totDiaCtrl*100):0;

  // ── Tabla ausentismo por especialidad
  const espList = [...new Set(Object.values(DB.especialistas).map(e=>e.especialidad))].sort();
  const ausentismoRows = espList.map(esp=>{

  const maxPct = Math.max(...ausentismoRows.map(r=>Math.max(r.pAusCNE,r.pAusCtrl)),1);
  const tablaRows = ausentismoRows.map(r=>`

        </div>
      </td>
      <td style="padding:14px 12px;text-align:right;font-size:18px;font-weight:500;color:#185FA5">${r.totInasCtrl}</td>
      <td style="padding:14px 12px;text-align:right">

  const uid = 'gen'+Date.now();

  return `

// ── PANEL INDICADORES ESPECÍFICOS ──
function renderIndicadoresEsp(mes){
  const esFiltroProf = profActivo && profActivo !== 'todos';
  const titulo = esFiltroProf ? profActivo : espActiva;
  const subtitulo = esFiltroProf
    ? (DB.especialistas[profActivo]?.especialidad || '')
    : espActiva;

  // Obtener nombres filtrados
  const nombres = Object.keys(DB.especialistas).filter(n => {
    if(esFiltroProf) return n === profActivo;
    return DB.especialistas[n].especialidad === espActiva;
  });

  if(!nombres.length) return '';

  // Iniciales de profesionales
  const iniciales = nombres.map(n => n.split(' ').slice(0,2).map(p=>p[0]).join(''));

  // Color de la especialidad
  const color = DB.especialistas[nombres[0]]?.color || '#0B4F72';

  // Acumular indicadores
  const indAcum = {};
  nombres.forEach(n => {
    const mesesKeys = mes === 'acum' ? DB.meses : [mes];
    mesesKeys.forEach(m => {
      const mdata = DB.especialistas[n]?.meses?.[m];
      const ind = mdata?.indicadores || '';
      if(ind) ind.split('|').forEach(item => {
        const [k,v] = item.trim().split(':');
        if(k && v) indAcum[k.trim()] = (indAcum[k.trim()]||0) + (parseInt(v.trim())||0);
      });
    });
  });

  // Renombres de indicadores
  const RENOMBRES = {
    'Aparatologia Fija':        'Instalación Aparato Fijo Ortodóncico',
    'Instalacion Contencion':   'Instalación Aparato de Contención Ortodóncico',
    'Retiros':                  'Retiro Aparatología Ortodoncia',
    'Proc Restaurador':         'Procedimiento Restaurador (Odontopediatría)',
    'Proc Pulpar':              'Procedimiento Pulpar (Odontopediatría)',
    'Etapa Protesica':          'Etapa Protésica',
    'Estudio Histopatologico':  'Estudio Histopatológico',
    'Prot Remov Acrilica':      'Prótesis Removible Acrílica',
    'Prot Remov Metalica':      'Prótesis Removible Metálica',
    'Prot Fija Unitaria':       'Prótesis Fija Unitaria',

    'Instalacion Dispositivo':  'Instalación Dispositivo',

    'Destartraje Supragingival':'Destartraje Supragingival',
    'Destartraje Subgingival':  'Destartraje Subgingival',
  };
  const indRenombrado = {};
  Object.entries(indAcum).forEach(([k,v]) => {
    indRenombrado[RENOMBRES[k] || k] = v;
  });

  // Tasa controles/alta para Periodoncia
  let tasaPerio = null;
  if(!esFiltroProf && espActiva === 'Periodoncia'){
    let totalCtrl = 0, totalAltas = 0;
    nombres.forEach(n => {
      const mesesKeys = mes === 'acum' ? DB.meses : [mes];
      mesesKeys.forEach(m => {
        const d = DB.especialistas[n]?.meses?.[m];
        if(d){ totalCtrl += d.control||0; totalAltas += d.altas||0; }
      });
    });
    if(totalAltas > 0) tasaPerio = (totalCtrl / totalAltas).toFixed(1);
  } else if(esFiltroProf && DB.especialistas[profActivo]?.especialidad === 'Periodoncia'){
    let totalCtrl = 0, totalAltas = 0;
    const mesesKeys = mes === 'acum' ? DB.meses : [mes];
    mesesKeys.forEach(m => {
      const d = DB.especialistas[profActivo]?.meses?.[m];
      if(d){ totalCtrl += d.control||0; totalAltas += d.altas||0; }
    });
    if(totalAltas > 0) tasaPerio = (totalCtrl / totalAltas).toFixed(1);
  }

  const items = Object.entries(indRenombrado).sort((a,b)=>b[1]-a[1]);
  if(!items.length) return '';

  const total = items.reduce((s,[,v])=>s+v,0);
  const maxVal = items[0][1];
  const PALETA = ['#0B4F72','#1A7AAF','#2196C4','#0E7A5A','#9A6200','#7B3F9E','#C0392B','#0F8B8D'];

  const periodoLabel = mes==='acum'
    ? `${DB.meses[0].replace(/^\d+_/,'')} – ${DB.meses[DB.meses.length-1].replace(/^\d+_/,'')} 2026`
    : mes.replace(/^\d+_/,'') + ' 2026';

function renderEspecialistas(mes){

    const p=pct(d.altas,d.meta_altas_mes);
    const pi=d.cne+d.control>0?Math.round((d.inasist_cne+d.inasist_ctrl)/(d.cne+d.control)*100):0;
    return {n,e,d,p,pi};
  }).sort((a,b)=>b.d.altas-a.d.altas);

  const chips = [...new Set(names.map(n=>DB.especialistas[n].especialidad))].sort();

  const tbody = rows.map(r=>`
    <tr class="esp-row" data-esp="${r.e.especialidad}">

  return `
<div class="frow">
  <span style="font-size:11px;color:var(--muted);font-weight:600">Especialidad:</span>
  <button class="chip on" onclick="filtrarEsp(this,'todas')">Todas</button>

        <th class="r">Altas</th><th class="r">Cumplimiento</th>

}

function setProfActivo(val){

function renderInasistencia(mes){
  const names = Object.keys(DB.especialistas);
  let totInas=0,totCne=0,totCtrl=0;

    const d=getDatoEsp(n,mes), e=DB.especialistas[n];
    const tot=d.inasist_cne+d.inasist_ctrl;
    const base=d.cne+d.control;
    const p=base>0?Math.round(tot/base*100):0;
    totInas+=tot; totCne+=d.cne; totCtrl+=d.control;
    return {n,tot,p,e,d};
  }).filter(x=>x.tot>0).sort((a,b)=>b.p-a.p);

  const pGlobal=totCne+totCtrl>0?Math.round(totInas/(totCne+totCtrl)*100):0;

  const rankRows = ranking.slice(0,12).map(r=>`

      <td class="r" style="color:#0057D9;font-weight:700">${r.d.inasist_ctrl}</td>
      <td class="r"><strong>${r.tot}</strong></td>

    </tr>`).join('');

  return `
<div class="krow krow3">
  ${kpi('#C0392B','Total inasistencias',totInas.toLocaleString('es-CL'),mes==='acum'?'Acumulado '+DB.meses.length+' meses':'Mes seleccionado')}
  ${kpi(pGlobal>25?'#C0392B':'#0E7A5A','Tasa global',pGlobal+'%','Meta institucional: &lt;20%')}
  ${kpi('#1A7AAF','Atenciones programadas',(totCne+totCtrl).toLocaleString('es-CL'),'CNE + Controles')}
</div>

  <div class="card">
    <div class="card-h"><div><div class="ct">Ranking por % inasistencia</div><div class="cs">Relativo a carga programada</div></div></div>

      <table class="tbl">
        <thead><tr><th>Especialista</th><th class="r">Inas.CNE</th><th class="r">Inas.Ctrl</th><th class="r">Total</th><th class="r">%</th></tr></thead>
        <tbody>${rankRows}</tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="card-h"><div><div class="ct">Evolución inasistencias</div><div class="cs">CNE vs Control por mes</div></div></div>
    <div style="position:relative;height:260px"><canvas id="ch-inas" role="img" aria-label="Evolución inasistencias"></canvas></div>

// ── GRÁFICOS ──
function drawCharts(mes){
  const names = Object.keys(DB.especialistas);
  const meses = DB.meses;
  const mesLabels = meses.map(m=>m.replace(/^\d+_/,''));

  if(profActivo!=='todos'){
    drawProfChart(profActivo);
    setTimeout(()=>{document.querySelectorAll('.pbf[data-w]').forEach(el=>{el.style.width=el.getAttribute('data-w')+'%';});},150);
    return;
  }

  if(espActiva==='todas'){
    // Evolución mensual
    const evolData = meses.map(m=>{
      let a=0,c=0,i=0;
      names.forEach(n=>{const d=getDatoEsp(n,m);a+=d.altas;c+=d.cne;i+=d.inasist_cne+d.inasist_ctrl;});
      return{a,c,i};
    });
    const c1=document.getElementById('ch-evol');
    if(c1) charts.c1=new Chart(c1,{type:'bar',data:{labels:mesLabels,datasets:[
      {label:'Altas',data:evolData.map(x=>x.a),backgroundColor:'#0B4F72',borderRadius:4,borderWidth:0},
      {label:'CNE',data:evolData.map(x=>x.c),backgroundColor:'#2196C4',borderRadius:4,borderWidth:0},
      {label:'Inasistencias',data:evolData.map(x=>x.i),backgroundColor:'#E8A87C',borderRadius:4,borderWidth:0},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:10,color:'#6B8CA4'}}},scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#6B8CA4'}},y:{grid:{color:'#F0F5F9'},ticks:{font:{size:11},color:'#6B8CA4'}}}}});

    // Donut especialidades
    const espGrupos={};
    names.forEach(n=>{
      const e=DB.especialistas[n], d=getDatoEsp(n,'acum');
      if(!espGrupos[e.especialidad]) espGrupos[e.especialidad]={altas:0,color:e.color};
      espGrupos[e.especialidad].altas+=d.altas;
    });
    const espK=Object.keys(espGrupos).filter(e=>espGrupos[e].altas>0);
    const c2=document.getElementById('ch-esp');
    if(c2) charts.c2=new Chart(c2,{type:'doughnut',data:{labels:espK,datasets:[{data:espK.map(e=>espGrupos[e].altas),backgroundColor:espK.map(e=>espGrupos[e].color),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10,padding:8,color:'#6B8CA4'}}}}});

    // Cumplimiento barras
    const top8=names.map(n=>{const d=getDatoEsp(n,mes),e=DB.especialistas[n];return{n,d,e};}).sort((a,b)=>b.d.altas-a.d.altas).slice(0,8);
    const c3=document.getElementById('ch-cumpl');
    if(c3) charts.c3=new Chart(c3,{type:'bar',data:{labels:top8.map(x=>x.n.split(' ')[0]),datasets:[
      {label:'Altas',data:top8.map(x=>x.d.altas),backgroundColor:top8.map(x=>x.e.color),borderRadius:5,borderWidth:0},
      {label:'Meta',data:top8.map(x=>x.d.meta_altas_mes),backgroundColor:'rgba(0,0,0,0.06)',borderRadius:5,borderWidth:0},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:8,color:'#6B8CA4'}}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#6B8CA4'}},y:{grid:{color:'#F0F5F9'},ticks:{font:{size:10},color:'#6B8CA4'}}}}});
  }

  // Animar barras
  setTimeout(()=>{document.querySelectorAll('.pbf[data-w]').forEach(el=>{el.style.width=el.getAttribute('data-w')+'%';});},150);

}

function renderPanelDias(){
  const diasOrden = ['Lunes','Martes','Miercoles','Jueves','Viernes'];
  const cntCNE={}, cntCtrl={};
  diasOrden.forEach(d=>{cntCNE[d]=0; cntCtrl[d]=0;});

  Object.entries(DB.inasistencias_detalle).forEach(([key,val])=>{
    Object.entries(val.dias||{}).forEach(([dia,n])=>{
      if(cntCNE[dia]!==undefined){
        cntCNE[dia]+=val.cne>0?n:0;
        cntCtrl[dia]+=val.ctrl>0?n:0;
      }
    });
  });

  const maxCNE=Math.max(...Object.values(cntCNE),1);
  const maxCtrl=Math.max(...Object.values(cntCtrl),1);

  function barHtml(dias, cnt, max, color){
    return diasOrden.map(d=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="width:70px;font-size:11px;color:var(--muted);font-weight:500">${d}</div>
        <div style="flex:1;background:var(--borde);border-radius:3px;height:14px;overflow:hidden">
          <div style="width:${Math.round(cnt[d]/max*100)}%;background:${color};height:100%;border-radius:3px;transition:width .8s"></div>
        </div>
        <div style="width:35px;text-align:right;font-size:11px;font-weight:700;color:${color}">${cnt[d]}</div>
      </div>`).join('');
  }

  const panCNE = document.getElementById('panel-inas-cne');
  const panCtrl = document.getElementById('panel-inas-ctrl');
  if(panCNE) panCNE.innerHTML = barHtml(diasOrden, cntCNE, maxCNE, '#C0392B');
  if(panCtrl) panCtrl.innerHTML = barHtml(diasOrden, cntCtrl, maxCtrl, '#E67E22');
}

// ── VISTA ESPECIALIDAD INLINE ──
function renderEspecialidadInline(mes){
  const esp = espActiva;
  const nombres = Object.keys(DB.especialistas).filter(n=>DB.especialistas[n].especialidad===esp);
  if(!nombres.length) return '';
  const color = DB.especialistas[nombres[0]].color;
  const periodoLabel = mes==='acum'
    ? `${DB.meses[0].replace(/^\d+_/,'')} – ${DB.meses[DB.meses.length-1].replace(/^\d+_/,'')} 2026`
    : mes.replace(/^\d+_/,'')+' 2026';

  let cne=0,ctrl=0,altas=0,inas=0,ppv=0,mA=0,mC=0;
  nombres.forEach(n=>{
    const d=getDatoEsp(n,mes);
    cne+=d.cne;ctrl+=d.control;altas+=d.altas;
    inas+=d.inasist_cne+d.inasist_ctrl;ppv+=d.ppv;
    mA+=d.meta_altas_mes;mC+=d.meta_cne_mes;
  });
  const pA=pct(altas,mA);
  const pInas=(cne+ctrl)>0?Math.round(inas/(cne+ctrl)*100):0;

  // Tabla especialistas
  const PALETA=['#0B4F72','#1A7AAF','#2196C4','#0E7A5A','#9A6200','#7B3F9E','#C0392B','#0F8B8D'];
  const tbody=nombres.map(n=>{
    const d=getDatoEsp(n,mes),e=DB.especialistas[n];
    const p=pct(d.altas,d.meta_altas_mes);
    const ini=n.split(' ').slice(0,2).map(x=>x[0]).join('');
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div style="width:26px;height:26px;border-radius:50%;background:${color}18;border:1px solid ${color}33;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${color};flex-shrink:0">${ini}</div>
        <span style="font-size:12px;font-weight:600;color:var(--texto)">${n}</span>
      </div></td>
      <td class="r">${d.cne}</td><td class="r">${d.control}</td>
      <td class="r" style="font-weight:700;color:${color}">${d.altas}</td>
      <td class="r"><div style="display:flex;align-items:center;gap:5px;justify-content:flex-end">
        <div class="mbar"><div class="mbarf" style="width:${Math.min(p,100)}%;background:${color}"></div></div>
        <span class="bdg ${pcls(p)}">${p}%</span>
      </div></td>
      <td class="r" style="font-size:11px;color:var(--muted)">${fmt(d.ppv)}</td>
    </tr>`;
  }).join('');

  // Indicadores acumulados
  const indAcum={};
  nombres.forEach(n=>{
    const mesesKeys=mes==='acum'?DB.meses:[mes];
    mesesKeys.forEach(m=>{
      const ind=DB.especialistas[n]?.meses?.[m]?.indicadores||'';
      if(ind) ind.split('|').forEach(item=>{
        const [k,v]=item.trim().split(':');
        if(k&&v) indAcum[k.trim()]=(indAcum[k.trim()]||0)+(parseInt(v.trim())||0);
      });
    });
  });
  const RENOMBRES={'Aparatologia Fija':'Instalación Aparato Fijo Ortodóncico','Instalacion Contencion':'Instalación Aparato de Contención Ortodóncico','Retiros':'Retiro Aparatología Ortodoncia','Proc Restaurador':'Procedimiento Restaurador (Odontopediatría)','Proc Pulpar':'Procedimiento Pulpar (Odontopediatría)','Etapa Protesica':'Etapa Protésica','Estudio Histopatologico':'Estudio Histopatológico','Estudio Clinico Lesiones':'Estudio Clínico Lesiones Territorio Oral','Prot Remov Acrilica':'Prótesis Removible Acrílica','Prot Remov Metalica':'Prótesis Removible Metálica','Prot Fija Unitaria':'Prótesis Fija Unitaria','Prot Fija InlayOnlay':'Prótesis Fija Inlay/Onlay','Instalacion Dispositivo':'Instalación Dispositivo','Terapia Fisica TTM':'Terapia Física TTM','Implantes Instalados':'N° Implantes Instalados','Prot Muco-Implantoasistida':'Prótesis Muco-Implantoasistida'};
  const indItems=Object.entries(indAcum).map(([k,v])=>([RENOMBRES[k]||k,v])).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const indTotal=indItems.reduce((s,[,v])=>s+v,0);
  const indMax=indItems[0]?.[1]||1;

  // Tasa Periodoncia
  let tasaPerio=null;
  if(esp==='Periodoncia'){
    let tC=0,tA=0;
    nombres.forEach(n=>{
      const mk=mes==='acum'?DB.meses:[mes];
      mk.forEach(m=>{const d=DB.especialistas[n]?.meses?.[m];if(d){tC+=d.control||0;tA+=d.altas||0;}});
    });
    if(tA>0) tasaPerio=(tC/tA).toFixed(1);
  }

  const nCols=indItems.length<=2?indItems.length:indItems.length<=4?2:indItems.length<=6?3:4;
  const indPanel=indItems.length>0?`
  <div style="padding:20px 22px;border-top:1px solid var(--borde)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">Indicadores específicos</span>
      <span style="font-size:12px;color:var(--muted)">${indTotal.toLocaleString('es-CL')} procedimientos${tasaPerio!==null?' · <span style="color:'+color+';font-weight:700">Tasa ctrl/alta: '+tasaPerio+'x</span>':''}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${nCols},1fr);gap:10px">
      ${indItems.map(([k,v],i)=>{
        const c=PALETA[i%PALETA.length];
        const w=Math.round(v/indMax*100);
        const p2=indTotal>0?Math.round(v/indTotal*100):0;
        return `<div style="background:#F8FAFC;border-radius:10px;border:1px solid #EDF2F7;padding:14px 16px;display:flex;align-items:center;gap:14px">
          <div style="flex:1;font-size:12px;font-weight:600;color:var(--texto);line-height:1.3">${k}</div>
          <div style="width:100px;flex-shrink:0">
            <div style="height:6px;background:#E8EEF4;border-radius:3px;overflow:hidden;margin-bottom:4px">
              <div style="width:${w}%;height:100%;background:${c};border-radius:3px"></div>
            </div>
            <div style="font-size:9px;color:var(--muted);text-align:right">${p2}% del total</div>
          </div>
          <div style="font-size:22px;font-weight:700;color:${c};line-height:1;min-width:44px;text-align:right">${v}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`:' ';

  return `
<div style="background:var(--blanco);border-radius:var(--r2);border:1px solid var(--borde);overflow:hidden;margin-bottom:16px">
  <div style="background:${color};padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div>
      <div style="font-size:17px;font-weight:700;color:#fff">${esp}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.65);margin-top:2px">${nombres.length} especialista${nombres.length>1?'s':''} · ${periodoLabel}</div>
    </div>
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${cne.toLocaleString('es-CL')}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">CNE</div></div>
      <div style="width:1px;height:30px;background:rgba(255,255,255,.2)"></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${ctrl.toLocaleString('es-CL')}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Controles</div></div>
      <div style="width:1px;height:30px;background:rgba(255,255,255,.2)"></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${altas.toLocaleString('es-CL')}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Altas</div></div>
      <div style="width:1px;height:30px;background:rgba(255,255,255,.2)"></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:${pA>=85?'#A8EFD0':pA>=55?'#FFE88A':'#FFB3AE'}">${pA}%</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Cumpl.</div></div>
      ${ppv>0?`<div style="width:1px;height:30px;background:rgba(255,255,255,.2)"></div><div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${fmt(ppv)}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">PPV</div></div>`:''}
      ${pInas>0?`<div style="width:1px;height:30px;background:rgba(255,255,255,.2)"></div><div style="text-align:center"><div style="font-size:20px;font-weight:700;color:${pInas>25?'#FFB3AE':'#fff'}">${pInas}%</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Inas.</div></div>`:''}
    </div>
  </div>
  <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr>
        <th style="padding-top:14px;padding-bottom:14px">Especialista</th><th class="r">CNE</th><th class="r">Control</th>
        <th class="r">Altas</th><th class="r">Cumpl.</th><th class="r">PPV</th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>
  ${indPanel}
</div>`;
}

// ── VISTA PROFESIONAL INLINE ──

  const nombre=profActivo;
  const e=DB.especialistas[nombre];
  if(!e) return '';
  const d=getDatoEsp(nombre,mes);
  const p=pct(d.altas,e.meta_altas);
  const pCNE=pct(d.cne,e.meta_cne);
  const pi=d.cne+d.control>0?Math.round((d.inasist_cne+d.inasist_ctrl)/(d.cne+d.control)*100):0;

  setTimeout(()=>drawProfChart(nombre),100);

<div style="background:${e.color};border-radius:var(--r2);padding:20px 24px;margin-bottom:16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
  <div style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0">${ini}</div>
  <div>
    <div style="font-size:18px;font-weight:700;color:#fff">${nombre}</div>
    <div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:2px">${e.especialidad} · ${periodoLabel}</div>
  </div>
  <div style="display:flex;gap:20px;margin-left:auto;flex-wrap:wrap">
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${d.cne}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">CNE</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${d.control}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Controles</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${d.altas}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Altas</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:${p>=85?'#A8EFD0':p>=55?'#FFE88A':'#FFB3AE'}">${p}%</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Cumpl.</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:${pCNE>=85?'#A8EFD0':pCNE>=55?'#FFE88A':'#FFB3AE'}">${pCNE}%</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Cumpl. CNE</div></div>
    <div style="text-align:center"><div style="font-size:20px;font-weight:700;color:${pi>25?'#FFB3AE':'rgba(255,255,255,.9)'}">${pi}%</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">Inas.</div></div>
    ${d.ppv>0?`<div style="text-align:center"><div style="font-size:20px;font-weight:700;color:#fff">${fmt(d.ppv)}</div><div style="font-size:9px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.06em">PPV</div></div>`:''}
  </div>
</div>
<div class="g2">
  <div class="card">
    <div class="card-h"><div><div class="ct">Evolución mensual</div><div class="cs">${nombre}</div></div></div>
    <div style="position:relative;height:220px"><canvas id="ch-prof-evol" role="img" aria-label="Evolución de ${nombre}"></canvas></div>
  </div>
  <div class="card">
